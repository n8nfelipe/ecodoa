services:
  db:
    image: postgres:16-alpine
    container_name: ecodoa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reciclagem
    ports:
      - "5433:5432"
    volumes:
      - ecodoa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reciclagem"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: ecodoa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/reciclagem?schema=public
      JWT_SECRET: troque-este-segredo-em-producao
      JWT_EXPIRES_IN: 7d
      BASE_URL: http://localhost:5174
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 5
    ports:
      - "3334:3333"
    volumes:
      - ecodoa_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ecodoa-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  ecodoa_pgdata:
  ecodoa_uploads: